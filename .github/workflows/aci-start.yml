name: aci-start

# Start the container group from GitHub. Signs in as an identity that can only read, start and stop it.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aci-container-group
  cancel-in-progress: false

jobs:
  start:
    name: Start the container group
    runs-on: ubuntu-latest
    environment: azure-power
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Sign in to Azure (OIDC, start/stop only)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Start
        run: |
          az container start -g rg-aciobs-app -n ci-aciobs-app
          az container show -g rg-aciobs-app -n ci-aciobs-app --query instanceView.state -o tsv
